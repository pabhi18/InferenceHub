apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: minio-console-virtualservice
  namespace: minio
spec:
  hosts:
  - minio-console.inferencehub.dpdns.org
  gateways:
  - istio-system/inferencehub-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: minio-console.minio.svc.cluster.local
        port:
          number: 9001
