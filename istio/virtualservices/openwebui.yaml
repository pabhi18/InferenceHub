apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: openwebui-virtualservice
  namespace: open-webui
spec:
  hosts:
  - open-webui.inferencehub.dpdns.org
  gateways:
  - istio-system/inferencehub-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: open-webui.open-webui.svc.cluster.local
        port: 
          number: 8080