replicaCount: 1

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8000

minio:
  endpoint: "minio.minio.svc.cluster.local:9000"

model:
  name: "gemma-2-2b-it"
  pvcName: ""

pvc:
  size: "10Gi"
  storageClass: "local-path"

resources:
  limits:
    cpu: "2"
    memory: "6Gi"
    nvidia.com/gpu: 1
  requests:
    cpu: "1"
    memory: "4Gi"
    nvidia.com/gpu: 1

nodeSelector:
  accelerator: nvidia

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule