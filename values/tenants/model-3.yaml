replicaCount: 1

env:
  - name: MODEL_ID
    value: "google/flan-t5-base"
  - name: PORT
    value: "8080"
    
pvc:
  size: "1Gi"
  storageClass: "standard"

resources:
  requests:
    cpu: "0.5"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  name: http

serviceAccount:
  create: true
  name: vllm-platform