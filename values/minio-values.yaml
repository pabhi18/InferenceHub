mode: standalone

replicas: 1

existingSecret: minio-secret

persistence:
  enabled: true
  size: 30Gi
  storageClass: local-path

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

service:
  type: ClusterIP
  port: 9000

consoleService:
  type: ClusterIP
  port: 9001