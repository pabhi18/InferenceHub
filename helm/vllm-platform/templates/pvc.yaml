{{/* PVC for vLLM model storage */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vllm-platform.fullname" . }}-storage
  labels:
    {{- include "vllm-platform.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: {{ .Values.pvc.size | default "4Gi" }}
  storageClassName: {{ .Values.pvc.storageClass | default "standard" }}
