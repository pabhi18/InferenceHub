<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Light grid background -->
  <defs>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d0d0d0" stroke-width="1"/>
    </pattern>
    <marker id="arrowhead2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <rect width="1400" height="1000" fill="#ffffff"/>
  <rect width="1400" height="1000" fill="url(#grid)"/>
  
  <!-- User -->
  <circle cx="120" cy="100" r="40" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="120" y="108" text-anchor="middle" font-size="14" fill="#333" font-family="Arial">User</text>
  
  <!-- Istio Gateway -->
  <rect x="270" y="60" width="140" height="80" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="340" y="90" text-anchor="middle" font-size="14" fill="#333" font-family="Arial" font-weight="bold">Istio Gateway</text>
  <text x="340" y="110" text-anchor="middle" font-size="10" fill="#666" font-family="Arial">(Ingress)</text>
  
  <!-- Arrow User to Gateway -->
  <line x1="160" y1="100" x2="270" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <circle cx="215" cy="100" r="12" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="215" y="105" text-anchor="middle" font-size="10" fill="#333" font-family="Arial" font-weight="bold">1</text>
  
  <!-- Open WebUI -->
  <rect x="550" y="60" width="140" height="80" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="620" y="95" text-anchor="middle" font-size="14" fill="#333" font-family="Arial" font-weight="bold">Open WebUI</text>
  
  <!-- Arrow Gateway to Open WebUI -->
  <line x1="410" y1="100" x2="550" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="480" y="90" text-anchor="middle" font-size="10" fill="#666" font-family="Arial">/</text>
  <circle cx="480" cy="100" r="12" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="105" text-anchor="middle" font-size="10" fill="#333" font-family="Arial" font-weight="bold">1</text>
  
  <!-- Tenant Namespace Box -->
  <rect x="510" y="220" width="550" height="300" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="785" y="245" text-anchor="middle" font-size="13" fill="#333" font-family="Arial" font-weight="bold">TENANT NAMESPACE</text>
  
  <!-- vLLM Pod Box -->
  <rect x="540" y="280" width="490" height="220" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="785" y="305" text-anchor="middle" font-size="13" fill="#333" font-family="Arial" font-weight="bold">vLLM Pod (GPU)</text>
  
  <!-- Init Container -->
  <rect x="560" y="330" width="140" height="60" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="630" y="350" text-anchor="middle" font-size="11" fill="#333" font-family="Arial" font-weight="bold">Init Container</text>
  <text x="630" y="370" text-anchor="middle" font-size="9" fill="#666" font-family="Arial">Download Models</text>
  
  <!-- vLLM Container -->
  <rect x="850" y="330" width="140" height="60" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="920" y="350" text-anchor="middle" font-size="11" fill="#333" font-family="Arial" font-weight="bold">vLLM Container</text>
  <text x="920" y="370" text-anchor="middle" font-size="9" fill="#666" font-family="Arial">Model Serving</text>
  
  <!-- PVC -->
  <rect x="560" y="420" width="430" height="50" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="775" y="450" text-anchor="middle" font-size="12" fill="#333" font-family="Arial" font-weight="bold">PVC: /models</text>
  
  <!-- Write arrow from Init to PVC -->
  <line x1="630" y1="390" x2="630" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="600" y="408" text-anchor="end" font-size="9" fill="#666" font-family="Arial">write</text>
  <circle cx="650" cy="405" r="12" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="650" y="410" text-anchor="middle" font-size="10" fill="#333" font-family="Arial" font-weight="bold">2</text>
  
  <!-- Read arrow from PVC to vLLM -->
  <line x1="920" y1="420" x2="920" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="950" y="408" text-anchor="start" font-size="9" fill="#666" font-family="Arial">read</text>
  <circle cx="900" cy="405" r="12" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="900" y="410" text-anchor="middle" font-size="10" fill="#333" font-family="Arial" font-weight="bold">3</text>
  
  <!-- Arrow Open WebUI to vLLM -->
  <line x1="620" y1="140" x2="785" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="685" y="205" text-anchor="middle" font-size="10" fill="#666" font-family="Arial"></text>
  <circle cx="700" cy="210" r="12" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="700" y="215" text-anchor="middle" font-size="10" fill="#333" font-family="Arial" font-weight="bold">1</text>
  
  <!-- MinIO Namespace Box -->
  <rect x="80" y="220" width="280" height="220" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="220" y="245" text-anchor="middle" font-size="13" fill="#333" font-family="Arial" font-weight="bold">MINIO NAMESPACE</text>
  
  <!-- MinIO Console -->
  <rect x="110" y="270" width="220" height="60" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="220" y="295" text-anchor="middle" font-size="13" fill="#333" font-family="Arial" font-weight="bold">MinIO Console</text>
  <text x="220" y="315" text-anchor="middle" font-size="9" fill="#666" font-family="Arial">Upload Models</text>
  
  <!-- MinIO -->
  <rect x="110" y="360" width="220" height="60" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="220" y="385" text-anchor="middle" font-size="13" fill="#333" font-family="Arial" font-weight="bold">MinIO</text>
  <text x="220" y="405" text-anchor="middle" font-size="9" fill="#666" font-family="Arial">Model Storage</text>
  
  <!-- Arrow MinIO Console to MinIO -->
  <line x1="220" y1="330" x2="220" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Arrow Gateway to MinIO Console -->
  <line x1="300" y1="140" x2="220" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="245" y="200" text-anchor="middle" font-size="10" fill="#666" font-family="Arial"></text>
  <circle cx="260" cy="205" r="12" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="210" text-anchor="middle" font-size="10" fill="#333" font-family="Arial" font-weight="bold">5</text>
  
  <!-- Arrow MinIO to Init Container -->
  <line x1="330" y1="390" x2="560" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="430" y="370" text-anchor="middle" font-size="10" fill="#666" font-family="Arial"></text>
  <circle cx="445" cy="375" r="12" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="445" y="380" text-anchor="middle" font-size="10" fill="#333" font-family="Arial" font-weight="bold">2</text>
  
  <!-- Monitoring Namespace Box -->
  <rect x="80" y="600" width="550" height="180" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="355" y="625" text-anchor="middle" font-size="13" fill="#333" font-family="Arial" font-weight="bold">MONITORING NAMESPACE</text>
  
  <!-- Prometheus -->
  <rect x="110" y="660" width="180" height="80" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="200" y="690" text-anchor="middle" font-size="13" fill="#333" font-family="Arial" font-weight="bold">Prometheus</text>
  <text x="200" y="715" text-anchor="middle" font-size="9" fill="#666" font-family="Arial">Scrape Metrics</text>
  
  <!-- Grafana -->
  <rect x="370" y="660" width="180" height="80" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="460" y="690" text-anchor="middle" font-size="13" fill="#333" font-family="Arial" font-weight="bold">Grafana</text>
  <text x="460" y="715" text-anchor="middle" font-size="9" fill="#666" font-family="Arial">Dashboards</text>
  
  <!-- Arrow Prometheus to Grafana -->
  <line x1="290" y1="700" x2="370" y2="700" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <circle cx="330" cy="700" r="12" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="705" text-anchor="middle" font-size="10" fill="#333" font-family="Arial" font-weight="bold">4</text>
  
  <!-- Arrow vLLM to Prometheus -->
  <line x1="630" y1="500" x2="200" y2="660" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="400" y="575" text-anchor="middle" font-size="10" fill="#666" font-family="Arial"></text>
  <circle cx="415" cy="580" r="12" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="415" y="585" text-anchor="middle" font-size="10" fill="#333" font-family="Arial" font-weight="bold">3</text>
  
  <!-- Arrow Gateway to Grafana -->
  <line x1="370" y1="140" x2="460" y2="660" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="400" y="380" text-anchor="middle" font-size="10" fill="#666" font-family="Arial"></text>
  <circle cx="415" cy="400" r="12" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="415" y="405" text-anchor="middle" font-size="10" fill="#333" font-family="Arial" font-weight="bold">5</text>
  
  <!-- Network Policy -->
  <rect x="1050" y="330" width="150" height="70" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="1125" y="355" text-anchor="middle" font-size="10" fill="#333" font-family="Arial" font-weight="bold">Network Policy</text>
  <text x="1125" y="375" text-anchor="middle" font-size="8" fill="#666" font-family="Arial">Allow: Open WebUI,</text>
  <text x="1125" y="388" text-anchor="middle" font-size="8" fill="#666" font-family="Arial">Monitoring</text>
  
  <!-- Flow Description -->
  <text x="710" y="570" font-size="12" fill="#333" font-family="Arial" font-weight="bold">Flow:</text>
  <text x="710" y="590" font-size="10" fill="#333" font-family="Arial">1. User → Gateway → Open WebUI → vLLM (inference)</text>
  <text x="710" y="610" font-size="10" fill="#333" font-family="Arial">2. Init Container downloads models from MinIO → PVC</text>
  <text x="710" y="630" font-size="10" fill="#333" font-family="Arial">3. vLLM reads models from PVC, exposes metrics</text>
  <text x="710" y="650" font-size="10" fill="#333" font-family="Arial">4. Prometheus scrapes metrics → Grafana visualizes</text>
  <text x="710" y="670" font-size="10" fill="#333" font-family="Arial">5. User accesses Grafana/MinIO Console via Gateway</text>
</svg>